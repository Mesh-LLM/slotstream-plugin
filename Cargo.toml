[package]
name = "mesh-slotstream"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Slotstream inference endpoint plugin for mesh-llm"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "d9c6e5a2ff3143c2c9161236bf24d415c403b9ca" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"


[[bin]]
name = "mesh-slotstream"
path = "src/main.rs"
